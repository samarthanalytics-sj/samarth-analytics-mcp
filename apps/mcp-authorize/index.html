<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authorize — Samarth GTM MCP</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #0b1220; color: #f4f7fb; }
      #root { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .wrap { width: 100%; max-width: 440px; padding: 24px; }
      h1 { font-size: 20px; margin: 0 0 16px; }
      .panel { background: #fff; border-radius: 10px; padding: 8px; }
      .hint { color: #9aa8c0; font-size: 13px; margin-top: 16px; }
      .consent { color: #0b1220; padding: 12px 8px; }
      .consent-title { margin: 0 0 12px; font-size: 15px; }
      .consent-logo { width: 40px; height: 40px; border-radius: 8px; margin-bottom: 8px; }
      .consent-scopes { margin: 0 0 16px; padding-left: 20px; font-size: 14px; color: #334155; }
      .consent-actions { display: flex; gap: 8px; justify-content: flex-end; }
      .consent-actions button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid #cbd5e1; cursor: pointer; }
      .consent-allow { background: #0b1220; color: #fff; border-color: #0b1220; }
      .consent-deny { background: #fff; color: #0b1220; }
      .consent-status { color: #334155; font-size: 14px; margin: 8px; }
      .consent-error { color: #b91c1c; font-size: 14px; margin: 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runtime config (public token) injected by the MCP server. -->
    <script src="/oauth/authorize/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
