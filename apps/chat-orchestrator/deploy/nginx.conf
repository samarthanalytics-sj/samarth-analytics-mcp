# Reverse proxy for the chat orchestrator.
#
# The settings that matter here are the streaming ones. With nginx defaults, a
# proxied response is buffered, so every token of a chat answer would be held
# until the turn finished and the feature would look broken while working
# perfectly. proxy_buffering off is not an optimization, it is required.

upstream orchestrator {
    server orchestrator:8787;
    keepalive 32;
}

# The headless-Chromium worker, run as a separate container on this host from
# apps/browser-worker/compose.yaml in the website repo. It joins this same
# `chat` network, so it resolves by name.
#
# Kept out of the orchestrator image on purpose: that image is Alpine, which
# Playwright does not support, and a browser OOM would take the chat service
# down with it. Same machine, same certificate, separate process.
upstream browser_worker {
    server browser-worker:8080;
    keepalive 8;
}

# Per-IP request limiting. The orchestrator applies its own per-user limits;
# this one exists to blunt an unauthenticated flood before it reaches Node.
limit_req_zone $binary_remote_addr zone=chat_req:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=chat_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name chat.aitagmanager.com;

    # ACME challenge must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chat.aitagmanager.com;

    ssl_certificate     /etc/letsencrypt/live/chat.aitagmanager.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.aitagmanager.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A chat turn carries a message plus history; it is never large. Anything
    # bigger is not a legitimate request.
    # Chat attachments arrive base64 in the JSON body. Kept just above the Express limit (28mb),
    # so an oversized upload is refused by the app with a readable JSON error rather than by nginx
    # with a bare 413 the composer cannot explain.
    client_max_body_size 30m;

    # The orchestrator sets CORS itself from its own allowlist. Adding headers
    # here as well would emit them twice and browsers reject that outright.

    location /health {
        proxy_pass http://orchestrator;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── The browser worker ──────────────────────────────────────────────────
    # /worker/probe, /worker/verify, /worker/ta-verify, /worker/healthy.
    # The trailing slash on proxy_pass strips the /worker prefix, so the worker
    # sees its own paths unchanged.
    #
    # Set VERIFY_WORKER_URL to https://chat.aitagmanager.com/worker/verify. The
    # tag-verify function derives the Tag Assistant endpoint from it by swapping
    # the suffix, so only that one URL is configured.
    location /worker/ {
        # Deliberately outside the chat rate-limit zones. A verification run is
        # a handful of requests that each take a minute; sharing a burst budget
        # with chat turns would have one starve the other.
        proxy_pass http://browser_worker/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # A browser launch plus several page loads routinely exceeds nginx's
        # 60s default, and a 504 here would reach the engine as "capture
        # failed" - indistinguishable from a site that genuinely did nothing.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Specs and captures are JSON, not uploads.
        client_max_body_size 2m;
    }

    location / {
        limit_req  zone=chat_req burst=10 nodelay;
        limit_conn chat_conn 8;

        proxy_pass http://orchestrator;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # --- Streaming. Remove any of these and the stream breaks. ---
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;

        # A turn with several tool calls runs well past the 60s default. The
        # orchestrator enforces its own budget and sends SSE heartbeats every 15s,
        # so this only needs to be comfortably longer than that.
        #
        # 25 minutes, not 5. A tag-suggestion scan is a plain POST with no
        # heartbeat to keep it alive, and its page budget now goes to 200 pages at
        # roughly six seconds each. At 300s nginx cut the connection mid-scan and
        # the browser reported a bare network error, which reads as "the server is
        # down" rather than "your scan is still running". Kept above the
        # orchestrator's own 20-minute scan ceiling so the APP is what gives up
        # first, with a sentence, rather than the proxy.
        proxy_read_timeout    1500s;
        proxy_send_timeout    1500s;
        proxy_connect_timeout 10s;
    }
}
