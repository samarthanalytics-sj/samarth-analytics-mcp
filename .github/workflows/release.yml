name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) and provenance attestation

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Skip releases created by semantic-release itself (commit message contains [skip ci])
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        # semantic-release requires ^22.14.0 || >=24.10.0. Node 20 made every
        # release since 2026-08-12 exit 1 before publishing anything.
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Semantic Release
        # main is protected (pull request + green CI required). The built-in
        # GITHUB_TOKEN cannot push the chore(release) commit past that rule, so
        # set RELEASE_TOKEN to a fine-grained PAT of a repo admin (Contents,
        # Issues, Pull requests: read/write). Falls back to GITHUB_TOKEN when
        # unset, which works only while main is unprotected.
        #
        # npm publishes through Trusted Publishing: @semantic-release/npm exchanges
        # this job's GitHub OIDC token (id-token: write above) for a short-lived
        # npm token, so no NPM_TOKEN secret is used. The trusted publisher is set
        # on npmjs.com for samarth-gtm-mcp: GitHub Actions, samarthanalytics-sj/
        # samarth-analytics-mcp, workflow release.yml, no environment. Without a
        # token fallback, a broken trusted-publisher setup now fails in
        # verifyConditions, BEFORE a version commit or tag is created, instead of
        # tagging a release that never reaches npm.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx semantic-release
