name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) and provenance attestation

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Skip releases created by semantic-release itself (commit message contains [skip ci])
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        # semantic-release requires ^22.14.0 || >=24.10.0. Node 20 made every
        # release since 2026-08-12 exit 1 before publishing anything.
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Semantic Release
        # main is protected (pull request + green CI required). The built-in
        # GITHUB_TOKEN cannot push the chore(release) commit past that rule, so
        # set RELEASE_TOKEN to a fine-grained PAT of a repo admin (Contents,
        # Issues, Pull requests: read/write). Falls back to GITHUB_TOKEN when
        # unset, which works only while main is unprotected.
        #
        # npm publishes through Trusted Publishing: @semantic-release/npm exchanges
        # this job's GitHub OIDC token (id-token: write above) for a short-lived
        # npm token, so no NPM_TOKEN secret is used. The trusted publisher entry
        # on npmjs.com for samarth-gtm-mcp must be: GitHub Actions,
        # samarthanalytics-sj/samarth-analytics-mcp, workflow release.yml, no
        # environment. When no entry matches, the run fails in verifyConditions
        # with ENONPMTOKEN, BEFORE a version commit or tag is created. Adding a
        # token is not the fix.
        #
        # Rules for the npmjs.com entry (setup steps: docs/DIRECTORY_LISTINGS.md):
        # - Allowed actions: direct publishing with npm publish must be allowed.
        #   Without it a new entry allows only staged publishing, and the
        #   release would then fail at the publish step, AFTER the git tag is
        #   pushed (reasoned from the release order, not observed).
        # - A new entry expires unless a publish succeeds within 2 days.
        # - The provider, user, repository and workflow filename of an entry
        #   cannot be changed. To change one, delete the entry and create a new
        #   one.
        # - The match breaks if this file is renamed. It may also break if this
        #   job gets an environment:, or if the repository or owner name changes
        #   (npm does not document these cases). If the run then fails as
        #   described above, recreate the entry.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx semantic-release
