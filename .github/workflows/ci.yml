name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Authorize UI (Stytch login + consent page served by the hosted server).
      # It is built inside the Docker image but was never checked here, so a
      # dependency bump that broke its build only surfaced on the next deploy.
      - name: Install authorize UI dependencies
        run: npm ci --prefix apps/mcp-authorize

      - name: Typecheck authorize UI
        run: npm --prefix apps/mcp-authorize run check

      - name: Build authorize UI
        run: npm --prefix apps/mcp-authorize run build

      # Chat orchestrator. It has its OWN package and tsconfig, so the root typecheck above never
      # touched it, and a type error reached main because the only thing that had ever run its
      # code was tsx, which transpiles without checking. Build first, then test: the tests live
      # inside the project, so only `tsc` catches a bad assertion in one of them.
      - name: Install orchestrator dependencies
        run: npm ci --prefix apps/chat-orchestrator

      - name: Build orchestrator
        run: npm --prefix apps/chat-orchestrator run build

      - name: Test orchestrator
        run: npm --prefix apps/chat-orchestrator test

      # The compiled dist/ under plain node, as the Docker image runs it (entrypoint, ESM output,
      # .js import extensions, PDF extraction in its worker). tsx above never exercises that path.
      - name: Test orchestrator build output
        run: npm --prefix apps/chat-orchestrator run test:build

      # Desktop app suite (registry approval guardrails, builders, smoke). Pure
      # Node via tsx — the Electron binary is never launched, so skip its download.
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck desktop
        run: npm --prefix apps/desktop run typecheck

      - name: Test desktop
        run: npm --prefix apps/desktop test

      # Customer portal (Vite client + Express server + Vercel api/**). It has its own package
      # and tsconfig, so the root typecheck never covered it, and nothing built it before deploy.
      - name: Install portal dependencies
        run: npm ci --prefix apps/portal

      - name: Typecheck portal
        run: npm run portal:check

      - name: Build portal
        run: npm run portal:build

      # Web audit MCP. Its pure-logic suite already runs in `npm test` via tsx, which transpiles
      # without checking, so only `tsc` against its own deps catches a type error in it.
      - name: Install web-audit dependencies
        run: npm ci --prefix apps/web-audit-mcp

      - name: Typecheck web-audit
        run: npm run webaudit:check

      # Runtime worker. It has no lockfile in git, so nothing is installed: the syntax check and
      # the SSRF guard tests use only Node built-ins.
      - name: Check runtime worker
        run: npm --prefix apps/runtime-worker run check

      - name: Test runtime worker SSRF guard
        working-directory: apps/runtime-worker
        run: node --test url-guard.test.mjs

  # The hosted service builds the root Dockerfile when it deploys, and no job here built it. So a
  # change that broke the image (a new base image, a dependency bump) was first seen during a
  # deploy. This job builds the image, starts it on the HTTP transport, and checks it with curl.
  # It pushes nothing and uses no secret.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t samarth-gtm-mcp:ci .

      # The token is a made-up value, not a secret. No Google credential is passed: the server
      # starts without one. GTM_MCP_HTTP_PORT pins the port (the default is also 3001), so a PORT
      # value added to the image later cannot move it. With a token set the server listens on
      # every interface, which the port mapping needs.
      - name: Start container
        id: start
        run: |
          docker run -d --name samarth-gtm-mcp-ci \
            -p 127.0.0.1:3001:3001 \
            -e GTM_MCP_TRANSPORT=http \
            -e GTM_MCP_HTTP_PORT=3001 \
            -e GTM_MCP_HTTP_AUTH_TOKEN=ci-fake-token-not-a-secret \
            samarth-gtm-mcp:ci

      # No write flag is passed, so the image must report its read-only defaults.
      - name: Check /health reports read-only
        run: |
          code=000
          for attempt in $(seq 1 30); do
            code="$(curl -s --max-time 5 -o "$RUNNER_TEMP/health.json" -w '%{http_code}' \
              http://127.0.0.1:3001/health || true)"
            if [ "$code" = "200" ]; then
              break
            fi
            echo "Attempt $attempt of 30: GET /health gave HTTP $code (000 = no answer yet)."
            sleep 1
          done
          if [ "$code" != "200" ]; then
            echo "GET /health did not return 200."
            exit 1
          fi
          cat "$RUNNER_TEMP/health.json"
          echo
          if ! jq -e '.status == "ok" and .guardrails.readOnly == true' "$RUNNER_TEMP/health.json" > /dev/null; then
            echo 'Expected "status":"ok" and guardrails.readOnly true.'
            exit 1
          fi

      # A full initialize request without the token must get 401. A 200 would mean the image
      # serves MCP calls to a caller that has no token.
      - name: Check POST /mcp without a token returns 401
        run: |
          code="$(curl -s --max-time 10 -o "$RUNNER_TEMP/mcp.json" -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0.0"}}}' \
            http://127.0.0.1:3001/mcp || true)"
          echo "POST /mcp without a token: HTTP $code"
          if [ "$code" != "401" ]; then
            echo "Expected 401. Answer body:"
            cat "$RUNNER_TEMP/mcp.json" || true
            exit 1
          fi

      # The same initialize request with the made-up token. The two checks above return before
      # the server builds an MCP server for the session. This request builds one and answers
      # through the MCP transport. If building it throws, the answer is 500, not 200. If the
      # initialize handler fails, the answer is still 200 but carries a JSON-RPC error. So the
      # check also requires "serverInfo", a field of the initialize result.
      - name: Check POST /mcp with the token returns 200
        run: |
          code="$(curl -s --max-time 10 -o "$RUNNER_TEMP/mcp-auth.txt" -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Authorization: Bearer ci-fake-token-not-a-secret' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0.0"}}}' \
            http://127.0.0.1:3001/mcp || true)"
          echo "POST /mcp with the token: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Expected 200. Answer body:"
            cat "$RUNNER_TEMP/mcp-auth.txt" || true
            exit 1
          fi
          if ! grep -q '"serverInfo"' "$RUNNER_TEMP/mcp-auth.txt"; then
            echo 'Expected an initialize result with "serverInfo". Answer body:'
            cat "$RUNNER_TEMP/mcp-auth.txt" || true
            exit 1
          fi

      - name: Print container logs
        if: failure() && steps.start.outcome == 'success'
        run: docker logs samarth-gtm-mcp-ci

      - name: Stop container
        if: always()
        run: docker rm -f samarth-gtm-mcp-ci
