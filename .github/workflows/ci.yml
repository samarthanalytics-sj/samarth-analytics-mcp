name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Desktop app suite (registry approval guardrails, builders, smoke). Pure
      # Node via tsx — the Electron binary is never launched, so skip its download.
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Typecheck desktop
        run: npm --prefix apps/desktop run typecheck

      - name: Test desktop
        run: npm --prefix apps/desktop test
